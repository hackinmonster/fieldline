services:
  db:
    # Tiger Data's TimescaleDB HA image — ships with PostGIS.
    image: timescale/timescaledb-ha:pg17
    environment:
      POSTGRES_PASSWORD: helene
      POSTGRES_DB: helene
    ports:
      - "5433:5432"
    volumes:
      - dbdata:/home/postgres/pgdata/data
      - ./backend/app/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
volumes:
  dbdata:

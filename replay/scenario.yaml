# DEMO-STUB scenario. Real feeds (NCDOT TIMS, USGS) are pulled from backend/data automatically.
# Everything under `events` and `volunteers` is hand-authored for the demo and flows
# through the same ingestion API / logic as real data.

start: "2024-09-27T10:00:00Z"   # 6:00 AM EDT, Helene's flooding underway
end:   "2024-09-30T04:00:00Z"
reset: true
ncdot_counties: [Buncombe]
usgs_every_min: 60

# Fast-forward through the storm, then near-real-time for the coordination story.
speed:
  - { from: "2024-09-27T10:00:00Z", speed: 3000 }   # ~1 min per 2 days
  - { from: "2024-09-29T13:50:00Z", speed: 12 }     # coordination phase

volunteers:
  # Demo volunteer — the presenter plays Jordan in the volunteer app.
  - { name: "Jordan Reyes", auto_accept: false, lon: -82.500, lat: 35.605,
      vehicle: { type: pickup, capacity_gal: 80, seats: 2, high_clearance: true },
      skills: [heavy_lifting], equipment: [water_jugs] }
  # Closer to Bee Tree Rd, but without a suitable vehicle — matching should skip them.
  - { name: "Maria Lopez", lon: -82.405, lat: 35.602, skills: [first_aid, spanish] }
  - { name: "Sam Whitaker", lon: -82.398, lat: 35.598, skills: [chainsaw], equipment: [chainsaw] }
  # Further away, capable.
  - { name: "Priya Nair", lon: -82.585, lat: 35.575,
      vehicle: { type: suv, capacity_gal: 30, seats: 5, high_clearance: true }, skills: [first_aid] }
  - { name: "Ben Carter", lon: -82.555, lat: 35.620,
      vehicle: { type: sedan, capacity_gal: 10, seats: 4, high_clearance: false } }
  - { name: "Alex Kim", lon: -82.530, lat: 35.612, verify_safe: true,
      vehicle: { type: suv, capacity_gal: 20, seats: 5, high_clearance: true }, skills: [first_aid, cpr] }
  - { name: "Tasha Green", lon: -82.640, lat: 35.555,
      vehicle: { type: minivan, capacity_gal: 40, seats: 7, high_clearance: false } }
  - { name: "Luis Ortega", lon: -82.470, lat: 35.540,
      vehicle: { type: pickup, capacity_gal: 60, seats: 3, high_clearance: true }, skills: [chainsaw], equipment: [chainsaw, generator] }
  - { name: "Hannah Moore", lon: -82.560, lat: 35.640, skills: [medical, cpr] }
  - { name: "Devon Price", lon: -82.320, lat: 35.617,
      vehicle: { type: sedan, capacity_gal: 8, seats: 4, high_clearance: false } }

events:
  # --- During the storm: life-safety traffic is for professionals, not volunteers ---
  - at: "2024-09-27T15:40:00Z"
    kind: radio
    label: "Water rescue traffic (should NOT become a volunteer task)"
    body:
      agency: "Swannanoa FD"
      channel: "BC Fire Dispatch"
      transcript: "Engine 2 to Buncombe, swift water, we got 2 occupants on a vehicle roof, Whitson Ave at the river, need swift water team, water still rising, 10-18."
      confidence: 0.82

  # --- Sep 28: background activity ---
  - at: "2024-09-28T19:15:00Z"
    kind: report
    label: "Shelter request"
    body:
      source_type: shelter
      channel: hotline
      reporter: "AB Tech shelter coordinator"
      text: "This is the shelter at AB Tech, 340 Victoria Rd Asheville. We have 3 infants here and are out of formula and diapers (size 3 and 4). Can someone bring some? Not an emergency but needed tonight."

  - at: "2024-09-29T12:30:00Z"
    kind: radio
    label: "Unconfirmed slide (hazard → verification only)"
    body:
      agency: "BCSO"
      channel: "BCSO Ops 1"
      transcript: "Unit 214, caller advising possible slide across Town Mtn Rd up past the overlook, unknown if passable, caller is second hand, no units free to check."
      confidence: 0.7

  # --- The story ---
  - at: "2024-09-29T14:00:00Z"
    kind: report
    pause: true
    label: "★ Resident SMS: elderly parents need drinking water"
    body:
      source_type: resident
      channel: sms
      reporter: "Dana (daughter)"
      text: "hi is this the help line? my parents are at 1144 Bee Tree Rd in Swannanoa, both in their 80s. no power since friday so the well pump is out = no water. they're down to like 2 bottles of drinking water. dad uses a walker and they cant drive out. can someone bring water?? I'm in Charlotte and can't get there"

  - at: "2024-09-29T14:03:00Z"
    kind: report
    label: "Neighbor corroborates (should ATTACH to same incident)"
    body:
      source_type: resident
      channel: app
      reporter: "neighbor"
      text: "The older couple at the end of our road on Bee Tree (1144) still have no water, I gave them what I could but we're running low too."

  - at: "2024-09-29T14:06:00Z"
    kind: radio
    pause: true
    label: "★ Radio: Riverwood Rd river crossing impassable (mid-route closure)"
    body:
      agency: "Swannanoa FD"
      channel: "BC Fire Dispatch"
      transcript: "Engine 2 to Buncombe, be advised Riverwood Rd at the Swannanoa River bridge is impassable, approach is washed out on the north side, request PW, we're 10-8 heading back toward State St."
      confidence: 0.88

  - at: "2024-09-30T03:59:00Z"
    kind: wait
    label: "end"

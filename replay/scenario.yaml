events:
  # ---------- During the storm: life-safety traffic is for professionals, not volunteers ----------
  - at: "2024-09-27T15:40:00Z"
    kind: radio
    label: "Water rescue traffic (should NOT become a volunteer task)"
    body:
      agency: "Swannanoa FD"
      channel: "BC Fire Dispatch"
      transcript: "Engine 2 to Buncombe, swift water, we got 2 occupants on a vehicle roof, Whitson Ave at the river, need swift water team, water still rising, 10-18."
      confidence: 0.82

  # ---------- Sep 28 ----------
  - at: "2024-09-28T16:20:00Z"
    kind: report
    label: "Social: grandfather unreachable in Barnardsville"
    body:
      source_type: social
      channel: x
      reporter: "@kaylin_mtns"
      lon: -82.418
      lat: 35.781
      text: "PLEASE SHARE 🙏 my grandpa Earl (79) lives alone on Dillingham Rd in Barnardsville / Big Ivy. no cell service up there and nobody's heard from him since thursday night. he doesnt drive anymore. can anyone nearby check on him?? #HeleneHelp #Barnardsville"

  - at: "2024-09-28T19:15:00Z"
    kind: report
    label: "Shelter: out of infant formula"
    body:
      source_type: shelter
      channel: hotline
      reporter: "AB Tech shelter coordinator"
      text: "This is the shelter at AB Tech, 340 Victoria Rd Asheville. We have 3 infants here and are out of formula and diapers (size 3 and 4). Can someone bring some? Not an emergency but needed tonight."

  - at: "2024-09-28T21:05:00Z"
    kind: report
    label: "Resident SMS (Spanish): family needs water + diapers in Leicester"
    body:
      source_type: resident
      channel: sms
      reporter: "Yesenia"
      text: "hola, somos una familia de 5 en Leicester Hwy cerca del Dollar General en Leicester. no tenemos agua desde el viernes y tenemos 2 niños chiquitos, se nos acabaron los pañales. no tenemos carro. alguien nos puede ayudar?"

  - at: "2024-09-28T23:30:00Z"
    kind: report
    label: "Social: diabetic neighbor's insulin warming in West Asheville"
    body:
      source_type: social
      channel: nextdoor
      reporter: "Rachel M. · West Asheville"
      lon: -82.5865
      lat: 35.5786
      text: "My neighbor on Haywood Rd (by the old Sears lot) is type 1 diabetic and her insulin has been out of the fridge since power went out Friday. Does anyone have a cooler + ice they could bring her? She's ok for now but worried."

  # ---------- Sep 29 morning ----------
  - at: "2024-09-29T11:10:00Z"
    kind: report
    label: "NGO: food boxes need drivers to Fairview"
    body:
      source_type: ngo
      channel: web
      reporter: "MANNA FoodBank dispatch"
      text: "MANNA request: Cane Creek Rd area in Fairview — about 15 households still cut off from groceries. We have 15 food boxes staged and need a volunteer driver to take them to the distribution table at Fairview Elementary School, Fairview NC. Boxes ~25 lb each, minivan or pickup works."

  - at: "2024-09-29T11:45:00Z"
    kind: report
    label: "NGO: dialysis patient needs a ride from Weaverville"
    body:
      source_type: ngo
      channel: hotline
      reporter: "Council on Aging of Buncombe County"
      text: "Client on Reems Creek Rd, Weaverville NC, 66, needs transportation to her dialysis appointment at the Asheville dialysis center tomorrow morning. Her regular transit service is suspended. She can walk with a cane, one passenger."

  - at: "2024-09-29T12:20:00Z"
    kind: report
    label: "Social: roof hole, elderly man alone in Candler"
    body:
      source_type: social
      channel: facebook
      reporter: "Candler Community Helene Group"
      lon: -82.7155
      lat: 35.5175
      text: "Reposting for my dad (68, lives alone) on Pisgah Hwy in Candler — a big oak came down on the back of his house and there's a hole in the roof, rain coming in. He needs a tarp put up, he can't get on a ladder himself. Anyone with a ladder and a strong back?"

  - at: "2024-09-29T12:30:00Z"
    kind: radio
    label: "Unconfirmed slide (hazard → verification only)"
    body:
      agency: "BCSO"
      channel: "BCSO Ops 1"
      transcript: "Unit 214, caller advising possible slide across Town Mtn Rd up past the overlook, unknown if passable, caller is second hand, no units free to check."
      confidence: 0.7

  - at: "2024-09-29T12:50:00Z"
    kind: report
    label: "Social: oxygen user needs ride to shelter in Black Mountain"
    body:
      source_type: social
      channel: facebook
      reporter: "Black Mountain Neighbors"
      lon: -82.3172
      lat: 35.6262
      text: "My aunt on Montreat Rd in Black Mountain uses an oxygen concentrator and the power is still out. Her backup tanks will last till about tonight. She needs a ride to the shelter at the Black Mountain Library where they have generator power. She's stable, not an emergency yet."

  # ---------- The hero incident: three independent sources, one household ----------
  - at: "2024-09-29T13:20:00Z"
    kind: report
    label: "★ Resident SMS: elderly parents need drinking water"
    body:
      source_type: resident
      channel: sms
      reporter: "Dana (daughter)"
      text: "hi is this the help line? my parents are at 1144 Bee Tree Rd in Swannanoa, both in their 80s. no power since friday so the well pump is out = no water. they're down to like 2 bottles of drinking water. dad uses a walker and they cant drive out. can someone bring water?? I'm in Charlotte and can't get there"

  - at: "2024-09-29T13:35:00Z"
    kind: report
    label: "★ Social: neighbor posts about the same couple"
    body:
      source_type: social
      channel: facebook
      reporter: "Swannanoa Valley Helene Updates"
      lon: -82.3995
      lat: 35.6265
      text: "The older couple at the end of our road on Bee Tree (1144) still have no water, I gave them what I could but we're running low too. Anyone with a truck able to bring a few days' worth? #Swannanoa"

  - at: "2024-09-29T13:50:00Z"
    kind: report
    label: "★ NGO: church outreach list flags the same household"
    body:
      source_type: ngo
      channel: web
      reporter: "Swannanoa Valley Fellowship outreach"
      text: "Outreach check-in list, Bee Tree Rd Swannanoa: #1144 — couple in their 80s, husband uses a walker, no well water since power loss, no vehicle access out. Need drinking water delivered (several days' supply). We have no drivers free today."

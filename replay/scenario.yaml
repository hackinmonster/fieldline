# DEMO-STUB scenario, loaded from the dashboard ("Load scenario") by backend/app/demo/runner.py.
# Real feeds (NCDOT TIMS closures, USGS gauges) are pulled from backend/data automatically.
# Everything under `events` and `volunteers` is hand-authored and flows through the same
# ingestion API / LLM pipeline / validator / matcher as real data. No code path references it.

start: "2024-09-27T10:00:00Z"        # 6:00 AM EDT, Helene's flooding underway
end:   "2024-09-29T14:10:00Z"
live_start: "2024-09-29T14:10:00Z"   # clock parks here when ingestion finishes; dispatch happens live
travel_speed: 30                     # clock fast-forward while a volunteer is driving
ncdot_counties: [Buncombe]
usgs_every_min: 60

volunteers:
  - { name: "Jordan Reyes", lon: -82.500, lat: 35.605,
      vehicle: { type: pickup, capacity_gal: 80, seats: 2, high_clearance: true },
      skills: [heavy_lifting], equipment: [water_jugs] }
